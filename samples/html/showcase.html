    <iframe width="512" height="384" id="run" src="http://127.0.0.1/mio/acepad/index.html?autostart=Factory+Reset"></iframe>

<script>
async function main() {
    const command=getQueryString("command");
    if (command) {
        const iframe=document.querySelector("#run");
        let received=false,ready=false;
        addEventListener("message",async (e)=>{
            console.log("recv",e, e.data);
            if (e.data.result==="ab") {
                ready=true;
                await iframe.contentWindow.postMessage(
                    {type:"shell",command},
                    {targetOrigin:"http://127.0.0.1"});
            }
        })
        while(!ready) {
            //console.log("send!",hash);
            await iframe.contentWindow.postMessage(
                {type:"shell",command:"strcat a b"},
                {targetOrigin:"http://127.0.0.1"});
            await new Promise(s=>setTimeout(s,16));
        }
    }
}  
main().then((s)=>0,(e)=>alert(e.stack));
function getQueryString(key, default_="") {
    if (arguments.length === 1) default_ = "";
    key = key.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
    var regex = new RegExp("[\\?&]" + key + "=([^&#]*)");
    var qs = regex.exec(location.href);
    if (qs == null) return default_;
    else return decodeURLComponentEx(qs[1]);
}
function decodeURLComponentEx(s) {
    return decodeURIComponent(s.replace(/\+/g, '%20'));
}

</script>
